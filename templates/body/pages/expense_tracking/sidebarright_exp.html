<div class="dashboard-card money-owed-card expense-sidebar-card col-md-2">
        <div class="dashboard-hero">
            <span class="dashboard-chip">Money To Pay</span>
            <div class="league-table-header money-owed-header">
                <span>Payee</span>
                <span class="pts-pad">Amount</span>
            </div>
            <div id="money-to-pay-list"></div>
            <div class="league-table-row money-owed-total">
                <span class="league-table-team">Total due</span>
                <span class="league-table-points" id="money-to-pay-total">CAD 0</span>
            </div>
        </div>
    </div>

<div class="modal fade" id="editMoneyToPayModal" tabindex="-1" aria-labelledby="editMoneyToPayModalLabel"
    aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content text-white">
            <div class="modal-header">
                <h5 class="modal-title text-white" id="editMoneyToPayModalLabel">Edit Amount</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                    aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="edit-money-to-pay-form">
                    <input type="hidden" id="edit-money-to-pay-id">
                    <p class="text-muted mb-3" id="edit-money-to-pay-name"></p>
                    <div class="mb-3 form-floating">
                        <input type="number" class="form-control" id="edit-money-to-pay-amount" placeholder="Amount"
                            min="0.01" step="0.01" required>
                        <label for="edit-money-to-pay-amount" class="text-white">Amount (CAD)</label>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" form="edit-money-to-pay-form" class="btn btn-primary">Save Changes</button>
            </div>
        </div>
    </div>
</div>
