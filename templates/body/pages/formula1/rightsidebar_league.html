<div class="col-md-2">
    <div class="dashboard-card">
        <div class="dashboard-hero">
            <span class="dashboard-chip">Constructors</span>
            <div class="league-table-header">
                <span>Team</span>
                <span class="pts-pad">Pts</span>
            </div>
            {% for t in team_standings|slice:":5" %}
            <div class="league-table-row">
                <span class="league-table-team">{{ t.name }}</span>
                <span class="league-table-points">{{ t.points|floatformat:0 }}</span>
            </div>
            {% empty %}
            <div class="league-table-row">
                <span class="league-table-team">Standings unavailable</span>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
