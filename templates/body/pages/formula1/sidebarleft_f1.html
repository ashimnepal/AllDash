<div class="col-md-2">
    <div class="dashboard-card">
        <div class="dashboard-hero">
            <span class="dashboard-chip">Drivers' Championship</span>
            <div class="league-table-header">
                <span>Driver</span>
                <span class="pts-pad">Pts</span>
            </div>
            {% for d in driver_standings|slice:":5" %}
            <div class="league-table-row">
                <span class="league-table-team">{{ d.name }}</span>
                <span class="league-table-points">{{ d.points|floatformat:0 }}</span>
            </div>
            {% empty %}
            <div class="league-table-row">
                <span class="league-table-team">Standings unavailable</span>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
